name: build
on:
   push:
      branches:
      - main
   pull_request:
   # Run by xterm-update.yml on the pull requests it opens, which do not start workflows by themselves.
   workflow_dispatch:
permissions:
   contents: write
# A new push to a pull request cancels the build of the previous one.
concurrency:
   group: build-${{ github.ref }}
   cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
   test:
      name: test (${{ matrix.name }})
      strategy:
         fail-fast: false
         matrix:
            include:
            -  name: Linux
               os: ubuntu-latest
               package: linux-gtk-x86_64.tar.gz
               install: eclipse
               home: eclipse
            -  name: Windows
               os: windows-latest
               package: win32-x86_64.zip
               install: eclipse
               home: eclipse
            -  name: macOS
               os: macos-latest
               package: macosx-cocoa-aarch64.dmg
               install: Eclipse.app
               home: Eclipse.app/Contents/Eclipse
      runs-on: ${{ matrix.os }}
      defaults:
         run:
            shell: bash
      env:
         ECLIPSE_URL: https://www.eclipse.org/downloads/download.php?file=/technology/epp/downloads/release/2026-06/R/eclipse-committers-2026-06-R-${{ matrix.package }}&r=1
      steps:
      -  name: Checkout
         uses: actions/checkout@v5
      -  name: Set up JDK
         uses: actions/setup-java@v5
         with:
            distribution: temurin
            java-version: 21
      -  name: Cache Eclipse
         id: eclipse
         uses: actions/cache@v4.2.4
         with:
           path: ~/${{ matrix.install }}
           key: eclipse-committers-2026-06-R-${{ matrix.package }}
      -  name: Download Eclipse
         if: steps.eclipse.outputs.cache-hit != 'true'
         run: |
            curl -sfL -o "$RUNNER_TEMP/${{ matrix.package }}" "$ECLIPSE_URL"
            case "${{ matrix.package }}" in
            *.tar.gz) tar xzf "$RUNNER_TEMP/${{ matrix.package }}" -C ~ ;;
            *.zip) 7z x -bd -y -o"$HOME" "$RUNNER_TEMP/${{ matrix.package }}" > /dev/null ;;
            *.dmg)
               hdiutil attach -quiet -nobrowse -readonly -mountpoint "$RUNNER_TEMP/dmg" "$RUNNER_TEMP/${{ matrix.package }}"
               cp -R "$RUNNER_TEMP/dmg/Eclipse.app" ~/
               hdiutil detach -quiet "$RUNNER_TEMP/dmg"
               ;;
            esac
            test -d ~/"${{ matrix.home }}/plugins"
      -  name: Install bash 5
         if: runner.os == 'macOS'
         run: brew list bash > /dev/null 2>&1 || brew install bash
      -  name: Install the browser and a display
         if: runner.os == 'Linux'
         run: |
            sudo apt-get update
            sudo apt-get install -y xvfb libwebkit2gtk-4.1-0 libgtk-3-0
            # The sandbox of WebKitGTK needs user namespaces, which the runner image restricts.
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      -  name: Test
         timeout-minutes: 30
         env:
            WEBKIT_DISABLE_COMPOSITING_MODE: 1
            WEBKIT_DISABLE_DMABUF_RENDERER: 1
         run: |
            export ECLIPSE_HOME="$HOME/${{ matrix.home }}"
            if [ "$RUNNER_OS" = Linux ]; then
               xvfb-run -a -s "-screen 0 1280x1024x24" ./test.sh
            else
               ./test.sh
            fi
      -  name: Upload coverage to Codecov
         if: always() && runner.os == 'Linux'
         uses: codecov/codecov-action@v5
         with:
            files: build/coverage.xml
            token: ${{ secrets.CODECOV_TOKEN }}
   build:
      runs-on: ubuntu-latest
      steps:
      -  name: Checkout
         uses: actions/checkout@v5
      -  name: Set up JDK
         uses: actions/setup-java@v5
         with:
            distribution: temurin
            java-version: 21
      -  name: Setup Maven
         uses: stCarolas/setup-maven@v5
         with:
           maven-version: 3.9.11
      -  name: Check xterm.js
         run: node xterm/update.mjs --check
      -  name: Set up cache
         uses: actions/cache@v4.2.4
         with:
           path: ~/.m2/repository
           key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
           restore-keys: |
             ${{ runner.os }}-maven-
      -  name: Build
         run: mvn -B clean install
      -  name: Release
         if: github.event_name == 'push'
         env:
            GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
         run: |
            gh release delete latest --yes --cleanup-tag || true
            gh release create latest --prerelease --title "Development Build" --target "$GITHUB_SHA" \
               --notes "Latest build of the main branch." \
               update-site/org.eclipse.xterm4eclipse/target/org.eclipse.xterm4eclipse.updatesite-*-SNAPSHOT.zip
      -  name: Publish p2 update site
         if: github.event_name == 'push'
         env:
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
         run: |
            remote="https://x-access-token:$GITHUB_TOKEN@github.com/$GITHUB_REPOSITORY"
            if git ls-remote --exit-code --heads "$remote" update-site > /dev/null; then
               git clone --depth 1 --branch update-site "$remote" site
            else
               git init -b update-site site
               git -C site remote add origin "$remote"
            fi
            rm -rf site/latest
            mkdir -p site/latest
            cp -r update-site/org.eclipse.xterm4eclipse/target/repository/* site/latest/
            cd site
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "New version of the update site"
            git push origin update-site
